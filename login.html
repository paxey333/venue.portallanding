<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="dark"/>
<title>Sign In — Venue.Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 18'%3E%3Cpath d='M0 0L6 9L0 18H4L10 9L4 0H0Z' fill='%23ffffff'/%3E%3Cpath d='M9 0L15 9L9 18H13L19 9L13 0H9Z' fill='%23555555'/%3E%3Crect x='19.5' y='7' width='4' height='4' rx='1' fill='%23ffffff'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000;--surface:#0a0a0a;--surface2:#141414;
  --border:#1f1f1f;--border2:#2a2a2a;
  --text:#e2e4ea;--text2:#8b8fa3;--text3:#5a5e72;
  --accent:#ff6b1a;
  --mono:'DM Mono',monospace;
  --display:'Syne',sans-serif;
  --sans:'DM Sans',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100dvh;-webkit-font-smoothing:antialiased}
.login-wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.login-logo{margin-bottom:32px;display:flex;align-items:center;gap:10px}
.login-logo svg{width:36px;height:27px}
.login-logo span{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.3px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 26px;width:100%;max-width:400px}
.login-title{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.login-field label{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.1em}
.login-field input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:16px;padding:11px 12px;border-radius:8px;outline:none;transition:border-color .15s;min-height:44px}
.login-field input:focus{border-color:var(--accent)}
.login-err{display:none;font-size:12px;color:#f87171;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);border-radius:6px;padding:9px 12px;margin:2px 0 8px;line-height:1.5}
.login-err.show{display:block}
.login-btn{width:100%;margin-top:8px;background:var(--accent);color:#fff;font-family:var(--sans);font-weight:600;font-size:14px;padding:13px;border:none;border-radius:8px;cursor:pointer;min-height:48px;transition:opacity .15s}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.5;cursor:default}
.login-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);text-align:center}
.login-foot a{color:var(--accent);font-weight:600;text-decoration:none}
.vp-ambient{--amb-opacity:0.05;--amb-speed:50s;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.vp-ambient svg{position:absolute;opacity:var(--amb-opacity);will-change:transform,opacity;animation:amb-drift var(--amb-speed) ease-in-out infinite alternate}
.vp-ambient svg:nth-child(1){width:120px;top:8%;left:5%;animation-delay:0s}
.vp-ambient svg:nth-child(2){width:80px;top:55%;right:8%;animation-delay:-8s;animation-duration:calc(var(--amb-speed) * 1.2)}
.vp-ambient svg:nth-child(3){width:180px;bottom:10%;left:50%;animation-delay:-20s;animation-duration:calc(var(--amb-speed) * 0.9)}
.vp-ambient svg:nth-child(4){width:60px;top:25%;right:25%;animation-delay:-14s;animation-duration:calc(var(--amb-speed) * 1.4)}
.vp-ambient svg:nth-child(5){width:100px;bottom:30%;left:15%;animation-delay:-6s;animation-duration:calc(var(--amb-speed) * 1.1)}
.vp-ambient svg:nth-child(6){width:140px;top:70%;right:40%;animation-delay:-18s}
@keyframes amb-drift{0%{transform:translateY(0) rotate(0deg);opacity:var(--amb-opacity)}50%{opacity:calc(var(--amb-opacity) * 1.5)}100%{transform:translateY(-30px) rotate(8deg);opacity:var(--amb-opacity)}}
@media(prefers-reduced-motion:reduce){.vp-ambient svg{animation:none}}
.expired-banner{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;background:rgba(248,113,113,0.12);border-bottom:1px solid rgba(248,113,113,0.25);color:#f87171;font-family:var(--mono);font-size:12px;text-align:center;padding:10px 16px;z-index:100}
</style>
</head>
<body>
<div class="vp-ambient"><svg viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg"><path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#fff"/><path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#fff"/></svg><svg viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg"><path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#fff"/><path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#fff"/></svg><svg viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg"><path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#fff"/><path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#fff"/></svg><svg viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg"><path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#fff"/><path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#fff"/></svg><svg viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg"><path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#fff"/><path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#fff"/></svg><svg viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg"><path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#fff"/><path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#fff"/></svg></div>
<div class="expired-banner" id="expired-banner">Your session expired. Please sign in again.</div>
<div class="login-wrap">
  <div class="login-logo">
    <svg viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#ffffff"/>
      <path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#ff6b1a"/>
      <rect x="19.5" y="7" width="4" height="4" rx="1" fill="#ffffff"/>
    </svg>
    <span>Venue.Portal</span>
  </div>
  <div class="login-card">
    <div class="login-title">Sign in</div>
    <div class="login-sub">Owner and admin access</div>
    <input type="text" style="display:none" autocomplete="username"/>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email"/>
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-pw" placeholder="" autocomplete="current-password"/>
    </div>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" id="login-btn" onclick="handleLogin()">Sign in</button>
    <div class="login-foot">
      Don't have an account? <a href="/onboard.html">Get onboarded</a>
    </div>
  </div>
</div>
<script>
(function(){
  if (new URLSearchParams(window.location.search).get('session_expired') === '1') {
    const b = document.getElementById('expired-banner');
    if (b) {
      b.style.display = 'block';
      setTimeout(() => { b.style.transition = 'opacity .3s'; b.style.opacity = '0'; setTimeout(() => b.remove(), 350); }, 5000);
    }
    history.replaceState({}, '', window.location.pathname);
  }
})();

const API_BASE = 'https://thevenueportal.paxey333.workers.dev';

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  const btn   = document.getElementById('login-btn');
  const err   = document.getElementById('login-err');
  if (!email || !pw) { err.classList.add('show'); err.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  err.classList.remove('show'); err.textContent = '';
  try {
    const res = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });
    const data = await res.json();
    if (!res.ok || !data.token) {
      err.classList.add('show'); err.textContent = data.error || 'Login failed.';
      btn.disabled = false; btn.textContent = 'Sign in';
      return;
    }
    localStorage.setItem('vp_admin_token', data.token);
    localStorage.setItem('vp_user_role', data.role || 'admin');
    localStorage.setItem('vp_user_name', data.name || '');
    if (data.venue_id != null) {
      localStorage.setItem('vp_venue_id', String(data.venue_id));
    } else {
      localStorage.removeItem('vp_venue_id');
    }
    if (data.role === 'venue_owner') {
      if (data.first_login) localStorage.setItem('vp_first_login', 'true');
      window.location.replace('dashboard.html');
    } else {
      window.location.replace('admin.html');
    }
  } catch (e) {
    err.classList.add('show'); err.textContent = 'Connection error. Try again.';
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

document.getElementById('login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
document.getElementById('login-email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-pw').focus(); });

// If already logged in, skip straight through
(function() {
  const token = localStorage.getItem('vp_admin_token');
  const role  = localStorage.getItem('vp_user_role');
  if (token && role) {
    if (role === 'venue_owner') window.location.replace('dashboard.html');
    else if (role === 'admin' || role === 'superadmin') window.location.replace('admin.html');
  }
})();
</script>
</body>
</html>
