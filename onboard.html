<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="dark"/>
<title>Venue Onboarding — Venue.Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 18'%3E%3Cpath d='M0 0L6 9L0 18H4L10 9L4 0H0Z' fill='%23ffffff'/%3E%3Cpath d='M9 0L15 9L9 18H13L19 9L13 0H9Z' fill='%23555555'/%3E%3Crect x='19.5' y='7' width='4' height='4' rx='1' fill='%23ffffff'/%3E%3C/svg%3E"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 18'%3E%3Cpath d='M0 0L6 9L0 18H4L10 9L4 0H0Z' fill='%23ffffff'/%3E%3Cpath d='M9 0L15 9L9 18H13L19 9L13 0H9Z' fill='%23555555'/%3E%3Crect x='19.5' y='7' width='4' height='4' rx='1' fill='%23ffffff'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000;--surface:#0a0a0a;--surface2:#141414;
  --border:#1f1f1f;--border2:#2a2a2a;
  --text:#ffffff;--text2:#a8a8a8;--text3:#666666;
  --accent:#ff6b1a;--accent-soft:rgba(255,107,26,0.12);--accent-warm:#e85d10;
  --green:#3ddc84;--green-soft:rgba(61,220,132,0.12);
  --alert:#ff4444;
  --font:'Inter',sans-serif;
  --radius:8px;--radius-lg:14px;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100%;-webkit-font-smoothing:antialiased}
body{position:relative;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit}

/* ── TOP NAV (matches index.html / venue.html / dashboard.html) ─── */
.topnav{position:sticky;top:0;z-index:50;background:rgba(0,0,0,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.topnav-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.3px}
.brand .dot{color:var(--accent)}
.nav-back{margin-left:auto;font-size:13px;font-weight:600;color:var(--text2);transition:color .15s;display:inline-flex;align-items:center;gap:5px}
.nav-back:hover{color:var(--text)}

/* ── MAIN ────────────────────────────────────────────────────── */
.main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:48px 24px 80px}
@media(max-width:640px){.main{padding:32px 18px 80px}}

/* ── HERO ────────────────────────────────────────────────────── */
.hero{margin-bottom:28px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);border:1px solid rgba(255,107,26,0.3);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:20px;margin-bottom:18px}
.hero-title{font-size:34px;font-weight:900;letter-spacing:-1.2px;line-height:1.05;margin-bottom:12px}
@media(min-width:760px){.hero-title{font-size:42px;letter-spacing:-1.5px}}
.hero-sub{font-size:15px;color:var(--text2);line-height:1.65;max-width:560px}

/* ── CARDS / FORM ────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:14px}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text2);font-weight:600;margin-bottom:16px}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row.single{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-full{grid-column:1 / -1}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);font-weight:600}
.label .req{color:var(--accent);margin-left:3px}
.input,.textarea{
  width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);
  font-family:var(--font);font-size:14px;line-height:1.5;
  padding:11px 12px;border-radius:var(--radius);
  transition:border-color .15s;min-height:44px;
}
.textarea{resize:vertical;min-height:80px;line-height:1.6}
.input:focus,.textarea:focus{outline:none;border-color:var(--accent)}
.input::placeholder,.textarea::placeholder{color:var(--text3)}

.amenity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amenity-opt{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s;min-height:42px}
.amenity-opt:hover{border-color:var(--text3)}
.amenity-opt input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.amenity-opt span{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.amenity-opt:has(input:checked){background:var(--accent-soft);border-color:rgba(255,107,26,0.4)}
.amenity-opt:has(input:checked) span{color:var(--accent);font-weight:600}

.submit-wrap{margin-top:22px}
.submit-err{display:none;background:rgba(255,68,68,0.08);border:1px solid rgba(255,68,68,0.25);color:#ff7a7a;font-size:12px;padding:10px 12px;border-radius:var(--radius);margin-bottom:12px;line-height:1.5}
.submit-btn{
  width:100%;background:var(--accent);color:#000;
  font-weight:800;font-size:14px;letter-spacing:-.1px;
  padding:14px;border-radius:var(--radius);border:none;cursor:pointer;
  transition:opacity .15s;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.submit-btn:hover{opacity:.88}
.submit-btn:disabled{background:var(--surface2);color:var(--text3);border:1px solid var(--border2);cursor:not-allowed}

/* ── SUCCESS STATE ───────────────────────────────────────────── */
.success-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 28px;text-align:center}
.success-icon{display:flex;justify-content:center;margin-bottom:22px}
.success-icon-circle{width:64px;height:64px;border-radius:50%;background:var(--green-soft);border:1.5px solid var(--green);display:flex;align-items:center;justify-content:center;position:relative}
.success-icon-circle::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(61,220,132,0.18);animation:successPulse 2.4s ease-in-out infinite}
@keyframes successPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.1);opacity:.2}}
.success-h{font-size:26px;font-weight:900;letter-spacing:-.7px;margin-bottom:14px}
.success-p{font-size:14px;color:var(--text2);line-height:1.65;max-width:440px;margin:0 auto 10px}

/* ── ENTRANCE ANIMATIONS ─────────────────────────────────────── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.anim-fade-up{animation:fadeInUp .6s ease both}
.anim-d0{animation-delay:0ms}
.anim-d1{animation-delay:80ms}
.anim-d2{animation-delay:160ms}
.anim-d3{animation-delay:240ms}
.anim-d4{animation-delay:320ms}
.anim-d5{animation-delay:400ms}
.anim-d6{animation-delay:480ms}
@media(prefers-reduced-motion:reduce){.anim-fade-up{animation:none}}

@media(max-width:700px){
  .hero-title{font-size:28px;letter-spacing:-1px}
  .card{padding:18px 16px}
  .form-row{grid-template-columns:1fr}
  .amenity-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .amenity-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- TOP NAV — matches v2 design system on other public pages -->
<header class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand">
      <svg width="22" height="16" viewBox="0 0 24 18" fill="none">
        <path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#ffffff"/>
        <path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#ffffff" opacity="0.4"/>
      </svg>
      <span>Venue<span class="dot">.</span>Portal</span>
    </a>
    <a href="/" class="nav-back">← Back to home</a>
  </div>
</header>

<main class="main">

  <div class="hero anim-fade-up anim-d0">
    <div class="hero-eyebrow">List your venue</div>
    <h1 class="hero-title">Tell us about your venue.</h1>
    <p class="hero-sub">Fill this out and we'll build your venue portal in 48 hours — live calendar, Stripe-secured deposits, real bookings. No upfront cost.</p>
  </div>

  <form id="onboard-form" novalidate>

    <!-- CARD 1: BASICS -->
    <div class="card anim-fade-up anim-d1">
      <div class="card-title">Venue basics</div>
      <div class="form-row">
        <div class="field field-full">
          <label class="label" for="f-name">Venue name<span class="req">*</span></label>
          <input class="input" id="f-name" name="venue_name" type="text" required placeholder="The Chill Room"/>
        </div>
        <div class="field field-full">
          <label class="label" for="f-address">Address<span class="req">*</span></label>
          <input class="input" id="f-address" name="address" type="text" required placeholder="1320 E Broadway Rd, Tempe AZ"/>
        </div>
        <div class="field">
          <label class="label" for="f-capacity">Capacity</label>
          <input class="input" id="f-capacity" name="capacity" type="number" min="0" placeholder="300"/>
        </div>
        <div class="field">
          <label class="label" for="f-price">Starting price per night ($)</label>
          <input class="input" id="f-price" name="price_per_day" type="number" min="0" placeholder="400"/>
        </div>
        <div class="field field-full">
          <label class="label" for="f-hours">Hours of operation</label>
          <input class="input" id="f-hours" name="hours" type="text" placeholder="Sun–Thu 2PM–12AM, Fri–Sat 2PM–2AM"/>
        </div>
      </div>
    </div>

    <!-- CARD 2: DESCRIPTION -->
    <div class="card anim-fade-up anim-d2">
      <div class="card-title">Description &amp; vibe</div>
      <div class="field">
        <label class="label" for="f-desc">Short description / vibe</label>
        <textarea class="textarea" id="f-desc" name="description" rows="3" placeholder="What makes your venue special? Who is it for?"></textarea>
      </div>
      <div class="field">
        <label class="label" for="f-rules">House rules</label>
        <textarea class="textarea" id="f-rules" name="house_rules" rows="3" placeholder="Any rules organizers should know? Sound limits, age restrictions, etc."></textarea>
      </div>
    </div>

    <!-- CARD 3: AMENITIES -->
    <div class="card anim-fade-up anim-d3">
      <div class="card-title">Amenities</div>
      <div class="amenity-grid" id="amenity-grid"></div>
    </div>

    <!-- CARD 4: MEDIA -->
    <div class="card anim-fade-up anim-d4">
      <div class="card-title">Media</div>
      <div class="field">
        <label class="label" for="f-photos">Photo links</label>
        <textarea class="textarea" id="f-photos" name="photo_links" rows="5" placeholder="Paste 3–5 image URLs, one per line. Or email photos to onboard@venueportal.us"></textarea>
      </div>
      <div class="field">
        <label class="label" for="f-video">YouTube video URL (optional)</label>
        <input class="input" id="f-video" name="video_url" type="text" placeholder="https://youtube.com/..."/>
      </div>
    </div>

    <!-- CARD 5: CONTACT -->
    <div class="card anim-fade-up anim-d5">
      <div class="card-title">Contact</div>
      <div class="form-row">
        <div class="field">
          <label class="label" for="f-cname">Your name<span class="req">*</span></label>
          <input class="input" id="f-cname" name="contact_name" type="text" required placeholder="Marcus A."/>
        </div>
        <div class="field">
          <label class="label" for="f-cemail">Email<span class="req">*</span></label>
          <input class="input" id="f-cemail" name="contact_email" type="email" required placeholder="you@example.com"/>
        </div>
        <div class="field field-full">
          <label class="label" for="f-cphone">Phone (optional)</label>
          <input class="input" id="f-cphone" name="contact_phone" type="tel" placeholder="(555) 123-4567"/>
        </div>
        <div class="field field-full">
          <label class="label" for="f-notes">Anything else we should know?</label>
          <textarea class="textarea" id="f-notes" name="additional_notes" rows="2" placeholder="Optional"></textarea>
        </div>
      </div>
    </div>

    <div class="submit-wrap anim-fade-up anim-d6">
      <div class="submit-err" id="submit-err"></div>
      <button class="submit-btn" id="submit-btn" type="submit">Submit venue details →</button>
    </div>

  </form>

</main>

<script>
const API_BASE = 'https://thevenueportal.paxey333.workers.dev';
const AMENITIES = ['Full Bar','Stage','Sound System','Dance Floor','Outdoor Patio','Green Room','Parking','Private Area','AV Equipment','Catering Kitchen','Projector','Security','BYOB Allowed','21+ Only','All Ages'];

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

(function renderAmenities(){
  const grid = document.getElementById('amenity-grid');
  grid.innerHTML = AMENITIES.map(a => `
    <label class="amenity-opt">
      <input type="checkbox" name="amenities" value="${esc(a)}"/>
      <span>${esc(a)}</span>
    </label>
  `).join('');
})();

function showError(msg){
  const err = document.getElementById('submit-err');
  err.textContent = msg;
  err.style.display = 'block';
  err.scrollIntoView({ behavior:'smooth', block:'center' });
}
function clearError(){
  const err = document.getElementById('submit-err');
  err.style.display = 'none';
  err.textContent = '';
}

function showSuccess(){
  document.getElementById('onboard-form').outerHTML = `
    <div class="success-card">
      <div class="success-icon">
        <div class="success-icon-circle">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 7"/></svg>
        </div>
      </div>
      <div class="success-h">Submission received</div>
      <div class="success-p">We will review your venue details and reach out within 48 hours to get your portal live.</div>
      <div class="success-p" style="margin-top:8px">In the meantime, check your email for a confirmation.</div>
    </div>
  `;
  window.scrollTo({ top:0, behavior:'smooth' });
}

document.getElementById('onboard-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const venueName    = document.getElementById('f-name').value.trim();
  const address      = document.getElementById('f-address').value.trim();
  const contactName  = document.getElementById('f-cname').value.trim();
  const contactEmail = document.getElementById('f-cemail').value.trim();

  if (!venueName)    { showError('Venue name is required.'); return; }
  if (!address)      { showError('Address is required.'); return; }
  if (!contactName)  { showError('Your name is required.'); return; }
  if (!contactEmail) { showError('Email is required.'); return; }
  if (!/^\S+@\S+\.\S+$/.test(contactEmail)) { showError('Please enter a valid email.'); return; }

  const amenities = [...document.querySelectorAll('input[name="amenities"]:checked')].map(el => el.value);

  const body = {
    venue_name:       venueName,
    address:          address,
    capacity:         document.getElementById('f-capacity').value.trim() || null,
    price_per_day:    document.getElementById('f-price').value.trim() || null,
    hours:            document.getElementById('f-hours').value.trim(),
    description:      document.getElementById('f-desc').value.trim(),
    house_rules:      document.getElementById('f-rules').value.trim(),
    amenities:        amenities,
    photo_links:      document.getElementById('f-photos').value.trim(),
    video_url:        document.getElementById('f-video').value.trim(),
    contact_name:     contactName,
    contact_email:    contactEmail,
    contact_phone:    document.getElementById('f-cphone').value.trim(),
    additional_notes: document.getElementById('f-notes').value.trim(),
  };

  const btn = document.getElementById('submit-btn');
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    const res = await fetch(API_BASE + '/api/onboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) {
      throw new Error(data.error || 'Submission failed. Please try again.');
    }
    showSuccess();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = orig;
    showError(err.message || 'Submission failed. Please try again.');
  }
});
</script>
</body>
</html>
