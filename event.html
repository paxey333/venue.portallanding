<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#000000"/>
<title>Event — Venue.Portal</title>
<meta property="og:title" content="Venue.Portal — Events"/>
<meta property="og:description" content="Discover events at independent venues."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://venueportal.us"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000;--surface:#0a0a0a;--surface2:#141414;
  --border:#1f1f1f;--border2:#2a2a2a;
  --text:#f0f0f0;--text2:#a8a8a8;--text3:#666666;
  --accent:#ff6b1a;--accent-soft:rgba(255,107,26,0.12);
  --event:#ff6b1a;
  --event-dim:rgba(255,107,26,.08);
  --event-border:rgba(255,107,26,.28);
  --event-glow:rgba(255,107,26,.35);
  --font:'Inter',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* page-level curtain fade */
.page-wrap{opacity:0;transition:opacity .45s ease}
.page-wrap.revealed{opacity:1}

/* glow orbs */
.splatter{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.splatter span{position:absolute;display:block;border-radius:50%;filter:blur(80px)}
.splatter span:nth-child(1){width:480px;height:480px;top:-120px;right:-100px;background:var(--event-dim)}
.splatter span:nth-child(2){width:360px;height:360px;top:40%;left:-120px;background:var(--event-dim);opacity:0.7}
.splatter span:nth-child(3){width:280px;height:280px;bottom:-80px;right:25%;background:rgba(255,107,26,0.06)}

/* lights backdrop */
.lights-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.light-pool{position:absolute;border-radius:50%;opacity:0.05}

@media(prefers-reduced-motion:no-preference){
  @keyframes lightBreathe{
    0%,100%{opacity:var(--lp-lo)}
    50%{opacity:var(--lp-hi)}
  }
  .light-pool{animation:lightBreathe var(--lp-dur) ease-in-out infinite;animation-delay:var(--lp-delay)}
}

.page{position:relative;z-index:1}

.topnav{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center}
.topnav-inner{max-width:1100px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.brand .dot{color:var(--accent)}

.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:28px;color:var(--accent);animation:loadPulse 1.2s ease-in-out infinite}
@keyframes loadPulse{0%,100%{opacity:.3}50%{opacity:1}}

/* hero */
.hero{position:relative;padding:80px 28px 60px;max-width:900px;margin:0 auto}
.hero-bg{position:fixed;top:0;left:0;width:100%;height:100vh;z-index:-1;overflow:hidden}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.25;aspect-ratio:16/9}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4) 0%,#000 85%)}
.hero-presenter{font-size:12px;font-weight:600;color:var(--event);text-transform:uppercase;letter-spacing:.22em;margin-bottom:18px}
.hero-title{font-size:clamp(54px, 8vw, 96px);font-weight:900;letter-spacing:-0.04em;line-height:0.92;text-transform:uppercase;margin-bottom:26px}
.hero-meta{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.14em;margin-bottom:32px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.hero-meta .sep{color:var(--text3);margin:0 8px}
.hero-desc{font-size:15px;font-weight:400;color:var(--text2);line-height:1.6;max-width:640px;font-style:italic}

/* copy-link chip */
.copy-link{display:inline-flex;align-items:center;gap:6px;margin-left:12px;padding:4px 10px;border:1px solid var(--border2);border-radius:4px;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;text-transform:uppercase;letter-spacing:.1em;transition:color .2s,border-color .2s;background:none;font-family:var(--font)}
.copy-link:hover{color:var(--text2);border-color:var(--text3)}
.copy-link svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none}

/* section labels */
.section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.22em;color:var(--event);margin-bottom:22px;display:flex;align-items:center;gap:12px}
.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--event-border),transparent)}

/* headliner cards */
.headliner-section{padding:80px 28px 0;max-width:1100px;margin:0 auto}
.headliner-grid{display:grid;gap:24px}
.headliner-grid[data-count="1"]{grid-template-columns:1fr}
.headliner-grid[data-count="2"]{grid-template-columns:repeat(2,1fr)}
.headliner-grid[data-count="3"]{grid-template-columns:repeat(3,1fr)}
.headliner-card{position:relative;aspect-ratio:16/10;border:1px solid var(--event-border);border-radius:6px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.headliner-card:hover{border-color:var(--event);box-shadow:0 12px 36px var(--event-glow)}
.headliner-grid[data-count="1"] .headliner-card{aspect-ratio:16/10}
.headliner-card .perf-img-wrap{position:absolute;inset:0;background:linear-gradient(135deg,var(--surface2),var(--surface));display:flex;align-items:center;justify-content:center}
.headliner-card .perf-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;backface-visibility:hidden}
.headliner-card .perf-img-wrap .img-backfill{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(28px) brightness(.5);z-index:0;display:none}
.headliner-card .perf-img-wrap img.contain{object-fit:contain;z-index:1;position:relative}
.headliner-card .perf-img-wrap .initial{font-weight:900;font-size:120px;color:var(--event);opacity:0.4;letter-spacing:-0.04em;display:none}
.headliner-card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.3) 40%,transparent 70%);pointer-events:none}
.headliner-card .perf-meta{position:absolute;left:28px;right:28px;bottom:28px;z-index:2}
.headliner-card .perf-name{font-size:clamp(32px,5vw,44px);font-weight:900;letter-spacing:-0.03em;text-transform:uppercase;margin-bottom:8px}
.headliner-card .perf-handle{font-size:13px;color:var(--event);letter-spacing:.06em}
.headliner-card .perf-handle .followers{color:var(--text2);margin-left:8px}
.headliner-card .music-chips{margin-top:12px}

/* support / performer cards */
.performers{padding:48px 28px 80px;max-width:1100px;margin:0 auto}
.performers.no-headliners{padding-top:80px}
.perf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.perf-card{position:relative;aspect-ratio:4/5;border:1px solid var(--event-border);border-radius:6px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.perf-card:hover{border-color:var(--event);box-shadow:0 8px 24px var(--event-glow)}
.perf-img-wrap{position:absolute;inset:0;background:linear-gradient(135deg,var(--surface2),var(--surface));display:flex;align-items:center;justify-content:center}
.perf-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/5;decoding:async;backface-visibility:hidden}
.perf-img-wrap .initial{font-weight:900;font-size:88px;color:var(--event);opacity:0.4;letter-spacing:-0.04em;display:none}
.perf-card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.35) 35%,transparent 65%);pointer-events:none}
.perf-meta{position:absolute;left:22px;right:22px;bottom:22px;z-index:2}
.perf-name{font-weight:800;font-size:32px;letter-spacing:-0.02em;text-transform:uppercase;margin-bottom:6px}
.perf-handle{font-size:12px;color:var(--event);letter-spacing:.06em}
.perf-handle .followers{color:var(--text2);margin-left:8px}
.perf-ig-link{display:block;text-decoration:none;color:inherit}

/* music chips */
.music-chips{display:flex;gap:8px;margin-top:10px;position:relative;z-index:3}
.music-chip{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);transition:background .2s,border-color .2s,transform .2s;color:#fff}
.music-chip:hover{background:var(--event-dim);border-color:var(--event);transform:scale(1.1)}
.music-chip svg{width:18px;height:18px}

/* team */
.team-section{padding:0 28px 80px;max-width:1100px;margin:0 auto}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.team-card{border:1px solid var(--event-border);border-radius:6px;padding:28px 20px 24px;background:var(--event-dim);text-align:center;display:block;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
.team-card:hover{border-color:var(--event);background:rgba(var(--event-r,255),var(--event-g,107),var(--event-b,26),0.05);transform:translateY(-2px);box-shadow:0 8px 24px var(--event-glow)}
.team-pfp{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;border:1px solid var(--event-border);background:var(--surface2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.team-pfp img{width:100%;height:100%;object-fit:cover;aspect-ratio:1/1;decoding:async}
.team-pfp .initial{font-weight:900;font-size:26px;color:var(--event);opacity:0.5;display:none}
.team-name{font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:4px}
.team-handle{font-size:11px;color:var(--event);letter-spacing:.04em;margin-bottom:8px}
.team-role{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.2em}
.team-music-chips{display:flex;gap:6px;justify-content:center;margin-top:10px}
.team-music-chips .music-chip{width:34px;height:34px}
.team-music-chips .music-chip svg{width:15px;height:15px}

/* venue */
.venue-section{padding:0 28px 80px;max-width:1100px;margin:0 auto}
.venue-block{border:1px solid var(--border2);border-radius:6px;padding:36px 32px;background:linear-gradient(135deg,rgba(255,107,26,0.04),var(--event-dim));display:flex;align-items:center;gap:24px}
.venue-icon{flex:0 0 56px;width:56px;height:56px;border-radius:50%;background:var(--event-dim);border:1px solid var(--event-border);display:flex;align-items:center;justify-content:center;color:var(--event)}
.venue-icon svg{width:26px;height:26px}
.venue-name{font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:6px}
.venue-meta{font-size:12px;color:var(--event);text-transform:uppercase;letter-spacing:.16em;margin-bottom:10px}
.venue-note{font-size:13px;font-weight:400;color:var(--text2);line-height:1.55}

@media(prefers-reduced-motion:no-preference){
  .venue-icon{animation:lockPulse 3.6s ease-in-out infinite}
}
@keyframes lockPulse{
  0%,100%{box-shadow:0 0 0 0 var(--event-glow),inset 0 0 0 0 var(--event-dim)}
  50%{box-shadow:0 0 0 8px transparent,inset 0 0 0 1px var(--event-border)}
}

/* tickets */
.tickets-section{padding:0 28px 80px;max-width:1100px;margin:0 auto}
.tickets-status{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--event);padding:8px 14px;border:1px solid var(--event-border);background:var(--event-dim);border-radius:4px;margin-bottom:22px}
.tickets-status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--event);box-shadow:0 0 10px var(--event-glow);animation:statusPulse 2s ease-in-out infinite}
@keyframes statusPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
.ticket-cta-row{display:flex;align-items:center;gap:18px;margin-bottom:28px;flex-wrap:wrap}
.ticket-cta{display:inline-flex;align-items:center;gap:14px;background:var(--event);color:#000;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.12em;padding:18px 30px;border-radius:4px;transition:filter .18s,transform .18s,box-shadow .18s;box-shadow:0 0 0 var(--event-glow)}
.ticket-cta:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 28px var(--event-glow)}
.ticket-cta svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;fill:none}
.ticket-note{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--text3)}
.ticket-iframe-wrap{border:1px solid var(--event-border);border-radius:6px;overflow:hidden;background:var(--surface)}
.ticket-iframe-wrap iframe{width:100%;height:820px;border:none;display:block}
.ticket-embed-note{text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--text3);padding:12px;background:var(--bg);border-top:1px solid var(--border)}
.ticket-embed-note a{color:var(--event);text-decoration:none}
.ticket-embed-note a:hover{text-decoration:underline}
.ticket-soon{display:inline-block;background:var(--surface);border:1px solid var(--border);padding:10px 24px;border-radius:20px;font-size:13px;font-weight:600;color:var(--text2)}

.past-recap{font-size:14px;color:var(--text2);line-height:1.6;padding:18px 0}
.past-recap a{color:var(--event);text-decoration:none}
.past-recap a:hover{text-decoration:underline}

/* sticky CTA bar */
.sticky-cta{position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 20px;display:flex;justify-content:center;transform:translateY(100%);transition:transform .2s ease}
.sticky-cta.visible{transform:translateY(0)}
.sticky-cta a{display:inline-flex;align-items:center;gap:10px;background:var(--event);color:#000;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.1em;padding:14px 32px;border-radius:4px;text-decoration:none}
.sticky-cta a svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;fill:none}

.copy-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:12px;font-weight:600;padding:8px 18px;border-radius:6px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:200;font-family:var(--font);letter-spacing:.06em}
.copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center}
.footer-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.footer-brand .dot{color:var(--accent)}
.footer-link{font-size:12px;color:var(--text3)}
.footer-link a{color:var(--text2);text-decoration:underline}

.not-found{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.not-found h1{font-size:36px;font-weight:900;letter-spacing:-1.5px;margin-bottom:8px}
.not-found p{color:var(--text2);margin-bottom:28px;font-size:14px}
.not-found a{background:var(--accent);color:#000;font-weight:800;padding:14px 32px;border-radius:8px;font-size:14px}

@media(max-width:640px){
  .hero{padding:60px 20px 40px}
  .hero-title{line-height:0.95}
  .headliner-grid[data-count="2"]{grid-template-columns:1fr}
  .headliner-grid[data-count="3"]{grid-template-columns:1fr}
  .headliner-card{aspect-ratio:4/5 !important}
  .headliner-card .perf-meta{left:18px;right:18px;bottom:18px}
  .headliner-card .perf-name{font-size:24px}
  .perf-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .perf-grid .perf-card:last-child:nth-child(odd){grid-column:1 / -1;max-width:calc(50% - 6px)}
  .perf-meta{left:14px;right:14px;bottom:14px}
  .perf-name{font-size:20px}
  .perf-handle{font-size:10px}
  .perf-handle .followers{display:block;margin-left:0;margin-top:2px}
  .music-chips{gap:6px;margin-top:8px}
  .music-chip{width:36px;height:36px}
  .music-chip svg{width:16px;height:16px}
  .team-grid{grid-template-columns:1fr;gap:10px}
  .team-card{display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px}
  .team-pfp{width:48px;height:48px;flex:0 0 48px;margin:0}
  .team-pfp .initial{font-size:20px}
  .team-name{font-size:18px;margin-bottom:2px}
  .team-handle{font-size:11px;margin-bottom:3px}
  .team-role{font-size:10px}
  .team-music-chips{justify-content:flex-start}
  .venue-block{flex-direction:column;align-items:flex-start;padding:26px}
  .ticket-iframe-wrap iframe{height:600px}
  .ticket-cta-row{gap:12px}
  .footer-inner{flex-direction:column;text-align:center}
  .copy-link{margin-left:0;margin-top:6px}
}

@media(prefers-reduced-motion:reduce){
  .perf-card,.team-card,.headliner-card{transition:none}
  .perf-card:hover,.team-card:hover,.headliner-card:hover{transform:none}
  .sticky-cta{transition:none}
  .page-wrap{transition:none}
  .lights-layer .light-pool{animation:none !important}
}
</style>
</head>
<body>

<div class="splatter" id="backdrop-glow" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="lights-layer" id="backdrop-lights" style="display:none" aria-hidden="true"></div>

<header class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand">
      <svg width="22" height="16" viewBox="0 0 24 18" fill="none"><path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#ffffff"/><path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#ffffff" opacity="0.4"/></svg>
      <span>Venue<span class="dot">.</span>Portal</span>
    </a>
  </div>
</header>

<div class="page-wrap" id="page-wrap">
<div class="page">
<main id="app">
  <div class="loading" id="loader">&raquo;</div>
</main>
</div>
</div>

<div class="sticky-cta" id="sticky-cta" style="display:none">
  <a id="sticky-cta-link" href="#" target="_blank" rel="noopener">Get Tickets <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>

<div class="copy-toast" id="copy-toast">Copied</div>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <svg width="18" height="13" viewBox="0 0 24 18" fill="none"><path d="M0 0L6 9L0 18H4L10 9L4 0H0Z" fill="#ffffff"/><path d="M9 0L15 9L9 18H13L19 9L13 0H9Z" fill="#ffffff" opacity="0.4"/></svg>
      <span>Venue<span class="dot">.</span>Portal</span>
    </div>
    <div class="footer-link"><a href="https://venueportal.us">venueportal.us</a></div>
  </div>
</footer>

<script>
const API_BASE = 'https://api.venueportal.us';

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  const n = parseInt(hex, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function setEventAccent(hex) {
  const [r, g, b] = hexToRgb(hex);
  const root = document.documentElement.style;
  root.setProperty('--event', hex);
  root.setProperty('--event-dim', `rgba(${r},${g},${b},.08)`);
  root.setProperty('--event-border', `rgba(${r},${g},${b},.28)`);
  root.setProperty('--event-glow', `rgba(${r},${g},${b},.35)`);
  root.setProperty('--event-r', r);
  root.setProperty('--event-g', g);
  root.setProperty('--event-b', b);
}

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function imgFallback(img) {
  img.style.display = 'none';
  const sib = img.nextElementSibling;
  if (sib) sib.style.display = 'flex';
}

function isValidUrl(s) {
  try { return new URL(s).protocol === 'https:'; } catch { return false; }
}

function musicChipSvg(type) {
  if (type === 'spotify') return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.56 14.46a.62.62 0 01-.86.21c-2.35-1.44-5.31-1.76-8.8-.96a.62.62 0 11-.28-1.21c3.81-.87 7.08-.5 9.72 1.1a.62.62 0 01.22.86zm1.22-2.72a.78.78 0 01-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.17a.78.78 0 11-.45-1.5c3.63-1.1 8.13-.57 11.23 1.33a.78.78 0 01.26 1.08zm.1-2.84c-3.22-1.91-8.54-2.09-11.62-1.16a.94.94 0 11-.54-1.8c3.53-1.07 9.4-.86 13.11 1.34a.94.94 0 01-.95 1.62z"/></svg>';
  if (type === 'soundcloud') return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M1.5 14.25c-.28 0-.5-.22-.5-.5v-3.5c0-.28.22-.5.5-.5s.5.22.5.5v3.5c0 .28-.22.5-.5.5zm2-1c-.28 0-.5-.22-.5-.5v-1.5c0-.28.22-.5.5-.5s.5.22.5.5v1.5c0 .28-.22.5-.5.5zm2 1.5c-.28 0-.5-.22-.5-.5v-4.5c0-.28.22-.5.5-.5s.5.22.5.5v4.5c0 .28-.22.5-.5.5zm2 .5c-.28 0-.5-.22-.5-.5v-5.5c0-.28.22-.5.5-.5s.5.22.5.5v5.5c0 .28-.22.5-.5.5zm2-.5c-.28 0-.5-.22-.5-.5V8.75c0-.28.22-.5.5-.5s.5.22.5.5v5.5c0 .28-.22.5-.5.5zm3.5.5h-1c-.28 0-.5-.22-.5-.5V7.25c0-.28.22-.5.5-.5.92 0 1.76.34 2.42.89A4.5 4.5 0 0122 11.75c0 1.8-1.34 3.28-3.07 3.48-.13.02-.27.02-.43.02z"/></svg>';
  if (type === 'youtube') return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.19a3.02 3.02 0 00-2.12-2.14C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.38.55A3.02 3.02 0 00.5 6.19 31.56 31.56 0 000 12a31.56 31.56 0 00.5 5.81 3.02 3.02 0 002.12 2.14c1.88.55 9.38.55 9.38.55s7.5 0 9.38-.55a3.02 3.02 0 002.12-2.14A31.56 31.56 0 0024 12a31.56 31.56 0 00-.5-5.81zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>';
  return '';
}

function renderMusicChips(person, cssClass) {
  const types = ['spotify', 'soundcloud', 'youtube'];
  const chips = types.filter(t => person[t] && isValidUrl(person[t]))
    .map(t => `<a href="${esc(person[t])}" target="_blank" rel="noopener" class="music-chip" title="${t[0].toUpperCase() + t.slice(1)}">${musicChipSvg(t)}</a>`);
  if (!chips.length) return '';
  return `<div class="${cssClass || 'music-chips'}">${chips.join('')}</div>`;
}

function isPast(dateStr) {
  if (!dateStr) return false;
  const [y, m, d] = dateStr.split('-').map(Number);
  const evtDate = new Date(y, m - 1, d, 23, 59, 59);
  return evtDate < new Date();
}

function copyLink() {
  navigator.clipboard.writeText(location.href).then(() => {
    const toast = document.getElementById('copy-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  });
}

function renderNotFound(reason) {
  document.title = 'Event Not Found — Venue.Portal';
  let heading = 'Event not found';
  let message = 'This event may have ended or moved.';
  if (reason === 'no-slug') {
    heading = 'No event specified';
    message = 'Use a link like /events/event-name to find an event.';
  } else if (reason === 'network') {
    heading = 'Connection error';
    message = 'Couldn’t reach the server. Check your connection and try again.';
  }
  document.getElementById('app').innerHTML = `
    <div class="not-found">
      <h1>${heading}</h1>
      <p>${message}</p>
      <a href="/">Browse Venues</a>
    </div>`;
  revealPage();
}

function revealPage() {
  document.fonts.ready.then(() => {
    requestAnimationFrame(() => {
      document.getElementById('page-wrap').classList.add('revealed');
    });
  });
}

function initLights(hex) {
  const layer = document.getElementById('backdrop-lights');
  if (!layer) return;
  document.getElementById('backdrop-glow').style.display = 'none';
  layer.style.display = '';

  const [r, g, b] = hexToRgb(hex);
  const isMobile = window.innerWidth < 480;
  const COUNT = isMobile ? 4 : 6;
  const durations = [2.8, 3.2, 3.6, 4.0, 4.3, 4.5];
  const positions = [
    { x: '10%', y: '-5%' }, { x: '50%', y: '-8%' }, { x: '85%', y: '-5%' },
    { x: '5%', y: '10%' }, { x: '70%', y: '5%' }, { x: '40%', y: '12%' }
  ];
  const sizes = isMobile
    ? [280, 240, 260, 220]
    : [360, 320, 340, 300, 280, 260];

  let html = '';
  for (let i = 0; i < COUNT; i++) {
    const isAccent = i % 2 === 0;
    const color = isAccent ? `rgba(${r},${g},${b},1)` : 'rgba(220,220,230,1)';
    const blur = 60 + Math.round(i * 6);
    const sz = sizes[i];
    const pos = positions[i];
    const dur = durations[i];
    const delay = -(i * 0.7);
    html += `<div class="light-pool" style="left:${pos.x};top:${pos.y};width:${sz}px;height:${sz}px;background:${color};filter:blur(${blur}px);--lp-lo:0.05;--lp-hi:0.18;--lp-dur:${dur}s;--lp-delay:${delay}s"></div>`;
  }
  layer.innerHTML = html;

  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  function applyMotion(reduced) {
    layer.querySelectorAll('.light-pool').forEach(p => {
      p.style.animation = reduced ? 'none' : '';
      if (reduced) p.style.opacity = '0.1';
      else p.style.opacity = '';
    });
  }
  applyMotion(mq.matches);
  mq.addEventListener('change', e => applyMotion(e.matches));

  const obs = new IntersectionObserver(entries => {
    const state = entries[0].isIntersecting ? 'running' : 'paused';
    layer.querySelectorAll('.light-pool').forEach(p => {
      p.style.animationPlayState = state;
    });
  }, { threshold: 0 });
  obs.observe(layer);
}

function renderPerfCard(p, isHeadliner) {
  const hasIg = !!p.ig;
  const igUrl = hasIg ? `https://instagram.com/${esc(p.ig)}` : '';
  const objPos = p.photo_position ? ` style="object-position:${esc(p.photo_position)}"` : '';
  const initial = (p.name || '?')[0].toUpperCase();
  const cardClass = isHeadliner ? 'headliner-card' : 'perf-card';
  const lazyAttr = isHeadliner ? '' : ' loading="lazy"';

  let html = `<div class="${cardClass}">`;
  const imgLink = hasIg ? `<a href="${igUrl}" target="_blank" rel="noopener" class="perf-ig-link">` : '';
  const imgLinkClose = hasIg ? '</a>' : '';
  html += `${imgLink}<div class="perf-img-wrap">`;
  if (p.photo_url) {
    html += `<img src="${esc(p.photo_url)}" alt="${esc(p.name)}"${objPos} decoding="async"${lazyAttr} onerror="imgFallback(this)"/>`;
  }
  html += `<div class="initial" style="${p.photo_url ? 'display:none' : 'display:flex'}">${esc(initial)}</div>`;
  html += `</div>${imgLinkClose}`;
  html += '<div class="perf-meta">';
  if (hasIg) {
    html += `<a href="${igUrl}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="perf-name">${esc(p.name)}</div>`;
    html += `<div class="perf-handle">@${esc(p.ig)}`;
    if (p.followers) html += `<span class="followers">${esc(String(p.followers))} followers</span>`;
    html += '</div></a>';
  } else {
    html += `<div class="perf-name">${esc(p.name)}</div>`;
  }
  html += renderMusicChips(p, 'music-chips');
  html += '</div></div>';
  return html;
}

function renderEvent(e) {
  document.title = esc(e.title) + ' — Venue.Portal';
  if (e.accent_color && e.accent_color !== '#ff6b1a') setEventAccent(e.accent_color);

  const eventIsPast = isPast(e.event_date);
  const performers = Array.isArray(e.performers) ? e.performers : [];
  const team = Array.isArray(e.team) ? e.team : [];

  if (e.backdrop === 'lights') {
    initLights(e.accent_color || '#ff6b1a');
  }

  const headliners = performers.filter(p => p.tier === 'headliner');
  const support = performers.filter(p => p.tier !== 'headliner');
  const hasHeadliners = headliners.length > 0;

  let html = '';

  if (e.hero_image_url) {
    html += `<div class="hero-bg"><img src="${esc(e.hero_image_url)}" alt="" decoding="async"/></div>`;
  }

  html += '<section class="hero">';
  if (e.presenter) {
    html += `<div class="hero-presenter">&mdash; ${esc(e.presenter)} presents</div>`;
  }
  html += `<h1 class="hero-title">${esc(e.title)}</h1>`;

  const meta = [];
  if (e.city) meta.push(esc(e.city));
  if (e.event_date) meta.push(formatDate(e.event_date));
  if (e.doors_time) meta.push('Doors ' + esc(e.doors_time));
  if (meta.length) {
    html += '<div class="hero-meta">' + meta.join('<span class="sep">&middot;</span>');
    html += '<button class="copy-link" onclick="copyLink()" title="Copy link"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke-linecap="round" stroke-linejoin="round"/></svg>Copy link</button>';
    html += '</div>';
  }

  if (e.description) {
    html += `<div class="hero-desc">${esc(e.description)}</div>`;
  }
  html += '</section>';

  // Headliners
  if (hasHeadliners) {
    const label = headliners.length === 1 ? 'Headliner' : 'Headliners';
    html += `<section class="headliner-section"><div class="section-label">${label}</div>`;
    html += `<div class="headliner-grid" data-count="${Math.min(headliners.length, 3)}">`;
    for (const p of headliners) {
      html += renderPerfCard(p, true);
    }
    html += '</div></section>';
  }

  // Support / Performers
  const showSupport = hasHeadliners ? support.length > 0 : performers.length > 0;
  if (showSupport) {
    const sectionLabel = hasHeadliners ? 'Support' : 'Performers';
    const extraClass = hasHeadliners ? '' : ' no-headliners';
    html += `<section class="performers${extraClass}"><div class="section-label">${sectionLabel}</div><div class="perf-grid">`;
    const cards = hasHeadliners ? support : performers;
    for (const p of cards) {
      html += renderPerfCard(p, false);
    }
    html += '</div></section>';
  }

  // Team
  if (team.length > 0) {
    html += '<section class="team-section"><div class="section-label">Team</div><div class="team-grid">';
    for (const t of team) {
      const link = t.ig ? `https://instagram.com/${esc(t.ig)}` : '#';
      const target = t.ig ? ' target="_blank" rel="noopener"' : '';
      const initial = (t.name || '?')[0].toUpperCase();
      html += `<a href="${link}"${target} class="team-card">`;
      html += '<div class="team-pfp">';
      if (t.photo_url) {
        html += `<img src="${esc(t.photo_url)}" alt="${esc(t.name)}" decoding="async" loading="lazy" onerror="imgFallback(this)"/>`;
      }
      html += `<div class="initial" style="${t.photo_url ? 'display:none' : 'display:flex'}">${esc(initial)}</div>`;
      html += '</div>';
      html += `<div><div class="team-name">${esc(t.name)}</div>`;
      if (t.ig) html += `<div class="team-handle">@${esc(t.ig)}</div>`;
      if (t.role) {
        let roleText = esc(t.role);
        if (t.followers) roleText += ` &middot; ${esc(String(t.followers))}`;
        html += `<div class="team-role">${roleText}</div>`;
      }
      html += '</div></a>';
      const teamMusic = renderMusicChips(t, 'team-music-chips');
      if (teamMusic) html += teamMusic;
    }
    html += '</div></section>';
  }

  // Venue
  const venueName = e.venue_name_public || null;
  html += '<section class="venue-section"><div class="section-label">Venue</div><div class="venue-block">';
  html += '<div class="venue-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>';
  html += '<div>';
  if (venueName) {
    html += `<div class="venue-name">${esc(venueName)}</div>`;
    if (e.city) html += `<div class="venue-meta">${esc(e.city)}</div>`;
    html += '<div class="venue-note">Full address sent via email upon ticket purchase.';
    if (e.doors_time) html += ` Doors at ${esc(e.doors_time)}.`;
    html += '</div>';
  } else {
    html += '<div class="venue-name">Venue TBA</div>';
    if (e.city) html += `<div class="venue-meta">${esc(e.city)}</div>`;
    html += '<div class="venue-note">Venue announced to ticket holders before doors.</div>';
  }
  html += '</div></div></section>';

  // Tickets / past-event
  if (eventIsPast) {
    html += '<section class="tickets-section"><div class="section-label">Event Recap</div>';
    const handle = e.presenter ? esc(e.presenter) : null;
    if (handle) {
      html += `<div class="past-recap">This night happened. Catch the next one &rarr; <a href="https://instagram.com/${handle}" target="_blank" rel="noopener">@${handle}</a></div>`;
    } else {
      html += '<div class="past-recap">This night happened. Stay tuned for the next one.</div>';
    }
    html += '</section>';
  } else {
    html += '<section class="tickets-section"><div class="section-label">';
    html += e.ticketing_url ? 'Live Ticketing' : 'Tickets';
    html += '</div>';
    if (e.ticketing_url) {
      html += `<div class="tickets-status">Tickets Live &middot; ${esc(e.title)}</div>`;
      html += '<div class="ticket-cta-row">';
      html += `<a href="${esc(e.ticketing_url)}" target="_blank" rel="noopener" class="ticket-cta">Get Tickets <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>`;
      html += '<span class="ticket-note">Instant confirmation</span>';
      html += '</div>';
      if (e.ticketing_provider === 'hi_events') {
        html += `<div class="ticket-iframe-wrap"><iframe src="${esc(e.ticketing_url)}" title="Get tickets" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>`;
        html += `<div class="ticket-embed-note">Trouble loading? <a href="${esc(e.ticketing_url)}" target="_blank" rel="noopener">Open in new tab &rarr;</a></div>`;
      }
    } else {
      html += '<div class="ticket-soon">Tickets coming soon</div>';
    }
    html += '</section>';
  }

  document.getElementById('app').innerHTML = html;
  revealPage();

  // Sticky CTA — triggers at 45% of hero height
  if (!eventIsPast && e.ticketing_url) {
    const stickyEl = document.getElementById('sticky-cta');
    const stickyLink = document.getElementById('sticky-cta-link');
    stickyLink.href = e.ticketing_url;
    stickyEl.style.display = '';

    const hero = document.querySelector('.hero');
    if (hero) {
      const obs = new IntersectionObserver(entries => {
        stickyEl.classList.toggle('visible', !entries[0].isIntersecting);
      }, { threshold: 0.55, rootMargin: '0px' });
      obs.observe(hero);
    }
  }
}

(async function init() {
  const m = location.pathname.match(/^\/events\/([A-Za-z0-9-]+)/);
  const slug = m ? m[1] : new URLSearchParams(location.search).get('slug');
  if (!slug) { renderNotFound('no-slug'); return; }

  try {
    const res = await fetch(`${API_BASE}/api/events/public/${encodeURIComponent(slug)}`);
    if (!res.ok) { renderNotFound('not-found'); return; }
    const data = await res.json();
    renderEvent(data);
  } catch (err) {
    console.error('[event] fetch error:', err);
    renderNotFound('network');
  }
})();
</script>
